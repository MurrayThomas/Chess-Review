name: Maintained source
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:source
      - run: npm run verify:history
      - run: npm test
      - run: npm run research:preflight -- D001 D002 --purpose inspect
      - run: node tools/calibration/reproduce-public.mjs
  research:
    needs: verify
    runs-on: windows-2025
    steps:
      # Non-research dependencies also occur in byte-bound historical inputs.
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Restore the evidence-bound Python runtime
        shell: pwsh
        run: ./scripts/setup-research-python.ps1
      - run: npm run research:preflight -- D001 D002 --purpose test
      - name: Run complete research tests
        shell: pwsh
        run: |
          $env:NODE_OPTIONS = '--import=' + ([System.Uri](Join-Path $env:GITHUB_WORKSPACE 'scripts/research-test-outputs.mjs')).AbsoluteUri
          npm run test:research
        env:
          CHESS_REVIEW_VERIFY_TEST_OUTPUTS: '1'
